version: 2

models:
  - name: payment_engine_log
    description: >-
      Raw snapshot of the internal payment engine, one row per source record.
      Original columns are loaded as text; empty fields become NULL and no rows are removed.
    columns:
      - name: txn_id
        description: Internal transaction ID; non-null and uniqueness checks run on staging.

  - name: paypal_us_activity
    description: >-
      One PayPal US CSV record, preserving source columns as text and all copies.
      Empty fields become NULL; source_file identifies the relative input path.
    columns:
      - name: Transaction ID
        quote: true
        description: Provider operation reference; intentionally not unique in this export.

  - name: stg_paypal_us
    description: >-
      One distinct PayPal US source record after removing exact copies before type conversion.
    columns:
      - name: transaction_id
        description: Original Transaction ID; exact copies removed, differing payloads retained without a blanket unique test.
        data_tests:
          - not_null
      - name: reference_txn_id
        description: Optional reference to the original payment, not a replacement for transaction_id.
      - name: invoice_id
        description: Merchant invoice/order reference, retained without matching to engine.
      - name: transaction_type
        description: Original PayPal Type, before canonical operation mapping.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Website Payment, Refund]
      - name: status
        description: Original PayPal status; these values define this export's supported states.
        data_tests:
          - not_null
      - name: payer_name
        description: Original Name field; not used as a matching identifier.
      - name: currency
        description: Currency of Gross, Fee and Net in this export.
        data_tests:
          - not_null
      - name: gross_amount
        description: Source Gross as DECIMAL(20,8); denied attempts still carry attempted amounts.
        data_tests:
          - not_null
      - name: fee_amount
        description: Source Fee as DECIMAL(20,8); charged fees are negative, not positive costs yet.
        data_tests:
          - not_null
      - name: net_amount
        description: Source Net as DECIMAL(20,8); equals Gross plus signed Fee for Completed/Refunded rows.
        data_tests:
          - not_null
      - name: event_timestamp_utc
        description: Timezone-aware event timestamp; displayed in UTC when the session timezone is UTC.
        data_tests:
          - not_null
      - name: source_file
        description: Relative source filename; no synthetic row number is introduced.

  - name: paypal_eu_activity
    description: >-
      PayPal EU Windows-1252 semicolon export, preserving all source records as text.

  - name: stg_paypal_eu
    description: >-
      One distinct PayPal EU source record, deduplicated before casting.
      Decimal commas are parsed without cent rounding. Date parsing chooses DD/MM/YYYY or
      MM/DD/YYYY only when the result falls within the period declared by source_file.
    columns:
      - name: transaction_id
        description: Provider operation reference; differing payloads with the same ID are retained.
        data_tests:
          - not_null
      - name: reference_txn_id
        description: Optional reference to the original payment.
      - name: invoice_id
        description: Optional merchant order reference, not yet matched to engine.
      - name: transaction_type
        description: Original PayPal Type, before canonical mapping.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Website Payment, Refund, Payment Reversal]
      - name: status
        description: Original PayPal status.
        data_tests:
          - not_null
      - name: payer_name
        description: Original Name decoded from Windows-1252.
      - name: currency
        data_tests:
          - not_null
      - name: gross_amount
        description: Source Gross as DECIMAL(20,8).
        data_tests:
          - not_null
      - name: fee_amount
        description: Source Fee as DECIMAL(20,8), retaining its original sign.
        data_tests:
          - not_null
      - name: net_amount
        description: Source Net as DECIMAL(20,8); Gross plus Fee for financial rows.
        data_tests:
          - not_null
      - name: event_timestamp_utc
        description: Timezone-aware timestamp resolved against the export period; invalid or out-of-period values become NULL.
        data_tests:
          - not_null
      - name: source_file
        description: Relative source filename, without synthetic row numbers.

  - name: dlocal_transactions
    description: dLocal CSV records as text, preserving copies and relative source_file.

  - name: stg_dlocal
    description: Exact copies removed before parsing; amounts in major units, source statuses and FX direction unchanged.
    columns:
      - name: transaction_id
        data_tests: [not_null]
      - name: transaction_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [PAYMENT, REFUND]
      - name: status
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: currency_exponent
        description: Source minor-unit exponent; local_amount supports 0–8 fractional digits.
        data_tests: [not_null]
      - name: local_amount
        description: DECIMAL(20,8) major units; source integer multiplied by 10 to the power of minus currency_exponent.
        data_tests: [not_null]
      - name: fx_rate
        description: Source rate as DECIMAL(18,10), local currency per USD; not yet inverted.
        data_tests: [not_null]
      - name: usd_amount
        data_tests: [not_null]
      - name: fee_usd
        description: Reported fee in USD, retaining the source sign.
        data_tests: [not_null]
      - name: event_timestamp_utc
        data_tests: [not_null]

  - name: adyen_payment_accounting
    description: Adyen CSV records as text, preserving all lifecycle events and relative source_file.

  - name: stg_adyen
    description: >-
      Exact copies removed before parsing, never deduplicated by Psp Reference alone.
      Debit/credit registers and fee components remain separate DECIMAL(20,8) fields;
      empty fields stay NULL, and nonempty monetary text is checked for parse errors.
    columns:
      - name: psp_reference
        description: Payment reference shared by multiple lifecycle events; not unique.
        data_tests: [not_null]
      - name: merchant_account
        data_tests: [not_null]
      - name: record_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Authorised, Settled, Refused, Refunded, Chargeback]
      - name: gross_currency
        data_tests: [not_null]
      - name: net_currency
        data_tests: [not_null]
      - name: event_timestamp_utc
        data_tests: [not_null]

  - name: google_play_earnings
    description: June and July-partial reports as text, skipping each title line and retaining source_file.

  - name: stg_google_play
    description: >-
      All Google Play report rows, including charges, refunds and fees; no deduplication
      without a reliable event ID. Amounts use DECIMAL(20,8), rates DECIMAL(18,10).
      No matching, fee pairing or canonical sign changes here.
    columns:
      - name: transaction_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Charge, Charge refund, Google fee]
      - name: product_id
        data_tests: [not_null]
      - name: buyer_currency
        data_tests: [not_null]
      - name: merchant_currency
        data_tests: [not_null]
      - name: buyer_amount
        data_tests: [not_null]
      - name: merchant_amount
        data_tests: [not_null]
      - name: currency_conversion_rate
        description: Reported merchant-currency units per buyer-currency unit, not recomputed.
        data_tests: [not_null]
      - name: event_timestamp_utc
        data_tests: [not_null]

  - name: fx_rates
    description: Exchange-rate feed snapshot as text;

  - name: stg_fx_rates
    description: Typed exchange-rate versions, keyed by rate_date, currency and published_at. Equal rows deduplicated after casting, at DECIMAL(18,10) precision; conflicting rates retained for the key test. Version selection is downstream.
    columns:
      - name: rate_date
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: usd_rate
        description: USD per one currency unit, as DECIMAL(18,10).
        data_tests: [not_null]
      - name: published_at
        description: Publication timestamp of this rate version, including timezone.
        data_tests: [not_null]

  - name: fee_schedule
    description: Contracted fee snapshot as text, without additional metadata.

  - name: stg_fee_schedule
    description: Typed tariffs keyed by psp, account and valid_from; equal typed rows deduplicated. Contract selection and fee calculations are downstream.
    columns:
      - name: percent_fee
        description: Percentage points (2.5 means 2.5%, not 0.025).
        data_tests: [not_null]
      - name: fixed_fee
        data_tests: [not_null]
      - name: fixed_fee_currency
        description: May be NULL when the fixed fee is zero; no currency is inferred.

  - name: int_paypal_us_events
    description: >-
      One PayPal US operation per transaction ID, mapped to the provider-event contract.
      Completed payments and refunded operations are settled financial events; denied
      payments are declined non-financial attempts. No June filter, engine join or fee extraction.
    columns:
      - name: provider_event_id
        description: Original transaction_id, without a provider prefix; unique together with psp. Conflicting keys fail rather than being arbitrarily resolved.
        data_tests: [not_null]
      - name: psp
        data_tests: [not_null]
      - name: provider_account
        description: NULL because no account identifier is supplied; paypal_us scopes event identity.
      - name: order_id
        description: Source Invoice ID; agrees with engine order_id for matching references in the supplied data.
      - name: amount_local_signed
        description: Signed Gross before fees, including attempted amounts for denied payments.
      - name: amount_usd_reported
        description: Gross for USD rows only; never Net or an inferred FX conversion.
      - name: fx_rate_reported
        description: NULL because the export contains no FX quote.
      - name: is_financial_event
        description: True for completed payments/refunds, false for denied payments. Unsupported type/status combinations remain NULL and fail this check.
        data_tests: [not_null]

  - name: int_paypal_us_fees
    description: One reported total fee per PayPal US staged operation, including zero fees; linked to events by (psp, provider_event_id). No expected-fee calculation.
    columns:
      - name: fee_amount
        description: Negated source Fee as DECIMAL(20,8); positive expense, negative fee return. NULL is never replaced with zero.
        data_tests: [not_null]

  - name: int_paypal_eu_events
    description: >-
      PayPal EU operations mapped to the shared event contract. Completed payments, refunds
      and reversals are financial; denied payments are non-financial attempts.
    columns:
      - name: is_financial_event
        data_tests: [not_null]

  - name: int_paypal_eu_fees
    description: One reported total fee per PayPal EU staged operation, including zero fees.
    columns:
      - name: fee_amount
        data_tests: [not_null]

  - name: int_dlocal_events
    description: >-
      dLocal operations mapped to the shared event contract. Source FX is inverted to
      USD per local unit; IN_MEDIATION is disputed and non-financial until resolved.
    columns:
      - name: is_financial_event
        data_tests: [not_null]

  - name: int_dlocal_fees
    description: One reported USD total fee per staged dLocal operation.
    columns:
      - name: fee_amount
        data_tests: [not_null]

  - name: int_paypal_us_matches
    description: PayPal US engine/provider pairs matched by PSP reference.

  - name: int_paypal_eu_matches
    description: PayPal EU engine/provider pairs matched by PSP reference.

  - name: int_dlocal_matches
    description: dLocal engine/provider pairs matched by PSP reference.

  - name: int_adyen_events
    description: >-
      Final Adyen sale, refund and chargeback events. Authorised rows are supporting
      lifecycle evidence and must resolve to a final sale state in the supplied extract.
    columns:
      - name: provider_event_id
        data_tests: [not_null]
      - name: is_financial_event
        data_tests: [not_null]

  - name: int_adyen_matches
    description: >-
      Adyen sales matched by PSP reference; refunds and chargebacks matched by order
      and operation type because their engine modification references differ.

  - name: int_adyen_fees
    description: Reported Adyen commission and markup components for settled sales.
    columns:
      - name: fee_amount
        data_tests: [not_null]

  - name: int_google_play_events
    description: >-
      Google Play charges and refunds mapped to the shared event contract. The event
      ID is derived from the timestamp, operation, product, country and currency.
      Merchant USD is retained separately from the buyer-currency principal.
    columns:
      - name: provider_event_id
        data_tests: [not_null]
      - name: is_financial_event
        data_tests: [not_null]

  - name: int_google_play_matches
    description: >-
      Unambiguous Google Play pairs matched by completion timestamp, operation,
      product, country and buyer currency. Amount remains a measured attribute.

  - name: int_google_play_fees
    description: Google fee rows linked one-to-one to charge events and expressed as positive USD expense.
    columns:
      - name: provider_event_id
        data_tests: [not_null]
      - name: fee_amount
        data_tests: [not_null]

  - name: int_provider_matches
    description: Union of accepted provider-specific event matches.
    columns:
      - name: engine_txn_id
        data_tests: [not_null]
      - name: provider_event_id
        data_tests: [not_null]
      - name: match_method
        data_tests: [not_null]

  - name: int_provider_fees
    description: Union of validated provider fee adapters at event and fee-component grain.

  - name: int_fx_rates
    description: One selected rate per date and currency, using the latest published revision.

  - name: int_payment_engine_events
    description: >-
      Shared engine events with signed principal, financial relevance, and separate event and
      reporting-scope timestamps. Country and SKU remain available for providers without
      transaction references. No provider matching or report-month filter.
    columns:
      - name: is_financial_event
        data_tests: [not_null]

  - name: int_provider_events
    description: >-
      Union of validated provider adapters enriched with the latest available FX rate on or
      before the UTC event date and a high-precision normalized USD principal amount.

  - name: mart_reconciliation_detail
    description: >-
      Shared monthly principal reconciliation. It identity-matches every implemented provider
      to engine events, measures both sides, and assigns one cause per row. Fees remain a
      separate reconciliation scope; ingestion duplicates remain a data-quality concern.
      Calculated provider USD is rounded to cents at event grain only when recognized.
    columns:
      - name: engine_in_period
        data_tests: [not_null]
      - name: provider_in_period
        data_tests: [not_null]
      - name: engine_is_financial_event
        data_tests: [not_null]
      - name: provider_is_financial_event
        data_tests: [not_null]
      - name: signed_usd_impact
        data_tests: [not_null]

  - name: mart_reconciliation_summary
    description: >-
      All-provider principal reconciliation by report month, provider and cause. Includes an
      aggregated matched row, both sides' USD totals, signed and absolute impact. Percentage
      shares use total absolute discrepancy for the month.

  - name: mart_fee_reconciliation_detail
    description: >-
      Event-level comparison of reported provider fees with the latest applicable
      account contract. Principal is valued in the reported fee currency, including
      USD fees on non-USD purchases. Positive variance means the provider charged more than expected.
    columns:
      - name: reported_fee_local
        data_tests: [not_null]
      - name: expected_fee_local
        data_tests: [not_null]
      - name: signed_fee_variance_usd
        data_tests: [not_null]

  - name: mart_fee_reconciliation_summary
    description: Fee reconciliation totals by month, provider, account, currency and cause.

  - name: stg_payment_engine
    description: >-
      Typed internal payment-engine snapshot, one row per txn_id.
      Preserves the original 15 columns and all rows, using strict casts for amounts, rates
      and timestamps without extra file metadata or derived business fields.
    columns:
      - name: txn_id
        data_tests:
          - not_null
          - unique
      - name: operation_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SALE, REFUND, CHARGEBACK]
