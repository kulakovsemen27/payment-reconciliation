version: 2

models:
  - name: payment_engine_log
    description: >-
      Raw snapshot of the internal payment engine, one row per source record.
      Original columns are loaded as text; empty fields become NULL and no rows are removed.
    columns:
      - name: txn_id
        description: Internal transaction ID; non-null and uniqueness checks run on staging.

  - name: paypal_us_activity
    description: >-
      One PayPal US CSV record, preserving source columns as text and all copies.
      Empty fields become NULL; source_file identifies the relative input path.
    columns:
      - name: Transaction ID
        quote: true
        description: Provider operation reference; intentionally not unique in this export.

  - name: stg_paypal_us
    description: >-
      One distinct PayPal US source record after removing exact copies before type conversion.
    columns:
      - name: transaction_id
        description: Original Transaction ID; exact copies removed, differing payloads retained without a blanket unique test.
        data_tests:
          - not_null
      - name: reference_txn_id
        description: Optional reference to the original payment, not a replacement for transaction_id.
      - name: invoice_id
        description: Merchant invoice/order reference, retained without matching to engine.
      - name: transaction_type
        description: Original PayPal Type, before canonical operation mapping.
        data_tests:
          - not_null
      - name: status
        description: Original PayPal status; these values define this export's supported states.
        data_tests:
          - not_null
      - name: payer_name
        description: Original Name field; not used as a matching identifier.
      - name: currency
        description: Currency of Gross, Fee and Net in this export.
        data_tests:
          - not_null
      - name: gross_amount
        description: Source Gross as DECIMAL(20,8); denied attempts still carry attempted amounts.
        data_tests:
          - not_null
      - name: fee_amount
        description: Source Fee as DECIMAL(20,8); charged fees are negative, not positive costs yet.
        data_tests:
          - not_null
      - name: net_amount
        description: Source Net as DECIMAL(20,8); equals Gross plus signed Fee for Completed/Refunded rows.
        data_tests:
          - not_null
      - name: date_raw
        description: Original MM/DD/YYYY date text.
      - name: time_raw
        description: Original HH:MM:SS time text.
      - name: time_zone
        description: Supplied timezone, used explicitly in timestamp parsing.
      - name: event_timestamp_utc
        description: Timezone-aware event timestamp; displayed in UTC when the session timezone is UTC.
        data_tests:
          - not_null
      - name: source_file
        description: Relative source filename; no synthetic row number is introduced.

  - name: paypal_eu_activity
    description: >-
      PayPal EU Windows-1252 semicolon export, preserving all source records as text.

  - name: stg_paypal_eu
    description: >-
      One distinct PayPal EU source record, deduplicated before casting.
      Decimal commas are parsed without cent rounding; dates use DD/MM/YYYY only.
      Suspected source date errors are investigated during reconciliation, not corrected here.
    columns:
      - name: transaction_id
        description: Provider operation reference; differing payloads with the same ID are retained.
        data_tests:
          - not_null
      - name: reference_txn_id
        description: Optional reference to the original payment.
      - name: invoice_id
        description: Optional merchant order reference, not yet matched to engine.
      - name: transaction_type
        description: Original PayPal Type, before canonical mapping.
        data_tests:
          - not_null
      - name: status
        description: Original PayPal status.
        data_tests:
          - not_null
      - name: payer_name
        description: Original Name decoded from Windows-1252.
      - name: currency
        data_tests:
          - not_null
      - name: gross_amount
        description: Source Gross as DECIMAL(20,8).
        data_tests:
          - not_null
      - name: fee_amount
        description: Source Fee as DECIMAL(20,8), retaining its original sign.
        data_tests:
          - not_null
      - name: net_amount
        description: Source Net as DECIMAL(20,8); Gross plus Fee for financial rows.
        data_tests:
          - not_null
      - name: date_raw
        description: Original date text, retained for investigating source date anomalies.
      - name: time_raw
        description: Original time text.
      - name: time_zone
        description: Supplied timezone, used explicitly in parsing.
      - name: event_timestamp_utc
        description: Timezone-aware timestamp parsed as DD/MM/YYYY; invalid values become NULL, valid but incorrect dates require downstream checks.
        data_tests:
          - not_null
      - name: source_file
        description: Relative source filename, without synthetic row numbers.

  - name: dlocal_transactions
    description: dLocal CSV records as text, preserving copies and relative source_file.

  - name: stg_dlocal
    description: Exact copies removed before parsing; amounts in major units, source statuses and FX direction unchanged.
    columns:
      - name: transaction_id
        data_tests: [not_null]
      - name: transaction_type
        data_tests: [not_null]
      - name: status
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: currency_exponent
        description: Source minor-unit exponent; local_amount supports 0–8 fractional digits.
        data_tests: [not_null]
      - name: local_amount
        description: DECIMAL(20,8) major units; source integer multiplied by 10 to the power of minus currency_exponent.
        data_tests: [not_null]
      - name: fx_rate
        description: Source rate as DECIMAL(18,10), local currency per USD; not yet inverted.
        data_tests: [not_null]
      - name: usd_amount
        data_tests: [not_null]
      - name: fee_usd
        description: Reported fee in USD, retaining the source sign.
        data_tests: [not_null]
      - name: created_at_raw
        description: Original UTC timestamp text.
      - name: event_timestamp_utc
        data_tests: [not_null]

  - name: adyen_payment_accounting
    description: Adyen CSV records as text, preserving all lifecycle events and relative source_file.

  - name: stg_adyen
    description: >-
      Exact copies removed before parsing, never deduplicated by Psp Reference alone.
      Debit/credit registers and fee components remain separate DECIMAL(20,8) fields;
      empty fields stay NULL, and nonempty monetary text is checked for parse errors.
    columns:
      - name: psp_reference
        description: Payment reference shared by multiple lifecycle events; not unique.
        data_tests: [not_null]
      - name: merchant_account
        data_tests: [not_null]
      - name: record_type
        data_tests: [not_null]
      - name: gross_currency
        data_tests: [not_null]
      - name: net_currency
        data_tests: [not_null]
      - name: creation_date_raw
        description: Original local timestamp; interpreted using the source TimeZone field.
      - name: event_timestamp_utc
        data_tests: [not_null]

  - name: google_play_earnings
    description: June and July-partial reports as text, skipping each title line and retaining source_file.

  - name: stg_google_play
    description: >-
      All Google Play report rows, including charges, refunds and fees; no deduplication
      without a reliable event ID. Amounts use DECIMAL(20,8), rates DECIMAL(18,10).
      No matching, fee pairing or canonical sign changes here.
    columns:
      - name: transaction_type
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: buyer_currency
        data_tests: [not_null]
      - name: merchant_currency
        data_tests: [not_null]
      - name: buyer_amount
        data_tests: [not_null]
      - name: merchant_amount
        data_tests: [not_null]
      - name: currency_conversion_rate
        description: Reported merchant-currency units per buyer-currency unit, not recomputed.
        data_tests: [not_null]
      - name: time_zone
        description: America/Los_Angeles, explicitly stated in both report headers.
      - name: event_timestamp_utc
        data_tests: [not_null]

  - name: fx_rates
    description: Exchange-rate feed snapshot as text;

  - name: stg_fx_rates
    description: Typed exchange-rate versions, keyed by rate_date, currency and published_at. Equal rows deduplicated after casting, at DECIMAL(18,10) precision; conflicting rates retained for the key test. Version selection is downstream.
    columns:
      - name: rate_date
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: usd_rate
        description: USD per one currency unit, as DECIMAL(18,10).
        data_tests: [not_null]
      - name: published_at
        description: Publication timestamp of this rate version, including timezone.
        data_tests: [not_null]

  - name: stg_payment_engine
    description: >-
      Typed internal payment-engine snapshot, one row per txn_id.
      Preserves the original 15 columns and all rows, using strict casts for amounts, rates
      and timestamps without extra file metadata or derived business fields.
    columns:
      - name: txn_id
        data_tests:
          - not_null
          - unique
